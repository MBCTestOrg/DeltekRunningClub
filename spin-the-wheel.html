<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Wheel — Awards Picker</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#00021D; font-family:'Montserrat',sans-serif; color:#fff; overflow:hidden; }

    body::before {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size:28px 28px;
    }

    /* NAV */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:99;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 28px;
      background:rgba(0,2,29,0.9); backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(23,66,245,0.25);
    }
    .nav-brand { font-size:10px; font-weight:700; letter-spacing:3px; color:#C9D1D9; opacity:.4; text-transform:uppercase; }
    .nav-links { display:flex; gap:8px; }
    .nav-link {
      font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
      color:#C9D1D9; text-decoration:none;
      padding:7px 14px; border-radius:8px; border:1px solid transparent;
      transition:border-color 0.2s, color 0.2s;
    }
    .nav-link:hover  { border-color:rgba(23,66,245,0.5); color:#fff; }
    .nav-link.active { border-color:#1742F5; color:#fff; }

    /* LAYOUT */
    .layout {
      position:fixed; inset:0; top:53px; z-index:1;
      display:flex; align-items:center; justify-content:center;
      gap:clamp(24px,3vw,48px); padding:16px 32px 24px;
    }

    /* LEFT — wheel */
    .wheel-side {
      display:flex; flex-direction:column; align-items:center; gap:16px;
      flex-shrink:0; padding-top:36px;
    }

    .wheel-wrap {
      position:relative;
      width:clamp(320px,46vw,600px);
      height:clamp(320px,46vw,600px);
    }

    /* pointer triangle at top */
    .pointer {
      position:absolute; top:-22px; left:50%; transform:translateX(-50%);
      width:0; height:0;
      border-left:14px solid transparent;
      border-right:14px solid transparent;
      border-top:30px solid #FF8C00;
      z-index:10;
      filter:drop-shadow(0 2px 6px rgba(255,140,0,0.6));
    }

    canvas#wheel {
      width:100%; height:100%;
      border-radius:50%;
      box-shadow:0 0 0 4px rgba(23,66,245,0.3), 0 0 60px rgba(23,66,245,0.2), 0 20px 60px rgba(0,0,0,0.6);
    }

    /* center hub */
    .hub {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:52px; height:52px; border-radius:50%;
      background:#00021D; border:4px solid #1742F5;
      display:flex; align-items:center; justify-content:center;
      font-size:20px; z-index:10;
      box-shadow:0 0 20px rgba(23,66,245,0.5);
      cursor:pointer;
    }

    /* SPIN button */
    .spin-btn {
      font-family:'Montserrat',sans-serif;
      font-size:15px; font-weight:900; letter-spacing:3px; text-transform:uppercase;
      color:#fff; background:#1742F5;
      border:none; border-radius:999px; padding:14px 48px;
      cursor:pointer; transition:background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow:0 0 30px rgba(23,66,245,0.5);
    }
    .spin-btn:hover   { background:#2d55ff; box-shadow:0 0 40px rgba(23,66,245,0.7); }
    .spin-btn:active  { transform:scale(0.97); }
    .spin-btn:disabled { background:rgba(23,66,245,0.3); cursor:not-allowed; box-shadow:none; }

    /* result — full-screen rectangular modal */
    .result-wrap {
      position:fixed; inset:0; z-index:200;
      display:none; align-items:center; justify-content:center;
      background:rgba(0,2,29,0.75); backdrop-filter:blur(10px);
    }
    .result-wrap.show { display:flex; animation:popIn 0.4s cubic-bezier(0.34,1.3,0.64,1); }
    @keyframes popIn { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }

    .result-card {
      display:flex; flex-direction:column; align-items:center; gap:16px;
      text-align:center; padding:52px 64px;
      background:#03061f; border:2px solid rgba(23,66,245,0.45);
      border-radius:28px;
      box-shadow:0 0 80px rgba(23,66,245,0.25), 0 40px 100px rgba(0,0,0,0.7);
      max-width:min(600px,88vw);
    }
    .result-award {
      font-size:clamp(16px,2.4vw,26px); font-weight:800; letter-spacing:1px;
      color:rgba(201,209,217,0.85);
    }
    .result-winner-label {
      font-size:11px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
      color:rgba(201,209,217,0.35); margin-top:-8px;
    }
    .result-name {
      font-size:clamp(32px,5vw,64px); font-weight:900; color:#FF8C00;
      line-height:1.1; word-break:break-word;
      text-shadow:0 0 32px rgba(255,140,0,0.55);
    }
    .result-close {
      margin-top:8px;
      font-family:'Montserrat',sans-serif; font-size:11px; font-weight:800;
      letter-spacing:2px; text-transform:uppercase;
      color:rgba(201,209,217,0.55); background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.15); border-radius:999px;
      padding:10px 28px; cursor:pointer;
      transition:background 0.2s, color 0.2s;
    }
    .result-close:hover { background:rgba(255,255,255,0.14); color:#fff; }

    /* award input */
    .award-label {
      font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
      color:#C9D1D9; opacity:.4;
    }
    .award-input {
      font-family:'Montserrat',sans-serif; font-size:13px; font-weight:600; color:#fff;
      background:#03061f; border:1px solid rgba(23,66,245,0.3);
      border-radius:10px; padding:9px 14px; outline:none; width:100%;
      transition:border-color 0.2s;
    }
    .award-input::placeholder { color:rgba(201,209,217,0.25); font-size:12px; }
    .award-input:focus { border-color:#1742F5; }

    /* RIGHT — list panel */
    .list-side {
      width:clamp(200px,22vw,300px); flex-shrink:0;
      display:flex; flex-direction:column; gap:10px;
      height:calc(100vh - 53px - 40px);
      margin-left:56px;
    }

    .panel-header {
      display:flex; align-items:baseline; justify-content:space-between;
    }
    .panel-title {
      font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
      color:#C9D1D9; opacity:.4;
    }
    .panel-count {
      font-size:11px; font-weight:700; color:#1742F5; opacity:.7;
    }
    .panel-hint {
      font-size:10px; font-weight:600; color:rgba(201,209,217,0.3);
      margin-top:-4px;
    }

    /* editable names textarea */
    .names-area {
      flex:1; min-height:0;
      font-family:'Montserrat',sans-serif;
      font-size:13px; font-weight:600; line-height:1.7;
      color:#fff;
      background:#03061f; border:1px solid rgba(23,66,245,0.25);
      border-radius:12px; padding:12px 14px;
      outline:none; resize:none;
      transition:border-color 0.2s;
    }
    .names-area::placeholder { color:rgba(201,209,217,0.2); }
    .names-area:focus { border-color:rgba(23,66,245,0.6); }
    .names-area::-webkit-scrollbar { width:3px; }
    .names-area::-webkit-scrollbar-track { background:transparent; }
    .names-area::-webkit-scrollbar-thumb { background:rgba(23,66,245,0.4); border-radius:3px; }

    /* add input row */
    .add-row { display:flex; gap:8px; align-items:flex-end; flex-shrink:0; }
    .add-input {
      flex:1; font-family:'Montserrat',sans-serif;
      font-size:13px; font-weight:600; color:#fff;
      background:#03061f; border:1px solid rgba(23,66,245,0.3);
      border-radius:10px; padding:10px 14px; outline:none;
      resize:none; height:66px; line-height:1.5;
      transition:border-color 0.2s;
    }
    .add-input::placeholder { color:rgba(201,209,217,0.25); font-size:11px; }
    .add-input:focus { border-color:#1742F5; }
    .add-btn {
      font-family:'Montserrat',sans-serif;
      font-size:18px; font-weight:700; color:#fff;
      background:#1742F5; border:none; border-radius:10px;
      width:40px; height:40px; cursor:pointer; transition:background 0.2s;
      flex-shrink:0;
    }
    .add-btn:hover { background:#2d55ff; }

  </style>
</head>
<body>

  <nav>
    <span class="nav-brand">Deltek Running Club</span>
    <div class="nav-links">
      <a href="index.html"            class="nav-link">← Home</a>
      <a href="spin-the-wheel.html"   class="nav-link active">Spin the Wheel</a>
      <a href="spin-wheel-light.html" class="nav-link">☀️ Light Mode</a>
    </div>
  </nav>

  <div class="layout">

    <!-- WHEEL -->
    <div class="wheel-side">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
        <div class="hub" onclick="spin()">🎲</div>
        <div class="result-wrap" id="resultWrap">
          <div class="result-card">
            <div class="result-award" id="resultAward"></div>
            <div class="result-winner-label" id="resultWinnerLabel">winner is</div>
            <div class="result-name" id="resultText"></div>
            <button class="result-close" onclick="closeResult()">✕ Close</button>
          </div>
        </div>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>
    </div>

    <!-- LIST -->
    <div class="list-side">
      <div class="award-label">Award / Prize</div>
      <input class="award-input" id="awardInput" placeholder="e.g. USD100 Raffle, Free Lunch…" maxlength="60">
      <div class="panel-header">
        <div class="panel-title">Names on the wheel</div>
        <div class="panel-count" id="nameCount"></div>
      </div>
      <div class="panel-hint">Edit directly — one name per line</div>
      <textarea class="names-area" id="namesList"
                placeholder="Names will appear here…"
                onblur="syncFromTextarea()"></textarea>
      <div class="add-row">
        <textarea class="add-input" id="addInput"
                  placeholder="Paste from Excel or type names — one per line or comma-separated…"
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addItem();}"></textarea>
        <button class="add-btn" onclick="addItem()" title="Add names">+</button>
      </div>
    </div>

  </div>

  <script>
    var COLORS = [
      '#1742F5','#FF8C00','#00B6C3','#A855F7',
      '#F59E0B','#EC4899','#22C55E','#FF6B35',
      '#6366F1','#14B8A6','#F97316','#8B5CF6'
    ];

    var items = [
      'Sarah Johnson','Mike Chen','Emma Davis','James Wilson',
      'Olivia Martinez','Liam Thompson','Ava Rodriguez','Noah Anderson'
    ];

    var currentAngle = 0;
    var spinning = false;
    var labelCache = [];

    var canvas = document.getElementById('wheel');
    var ctx = canvas.getContext('2d');

    function buildLabelCache() {
      var size = canvas.width, r = size / 2 - 4;
      var maxW = r * 0.78;
      var fontSize = Math.min(Math.max(size * 0.026, 10), 17);
      ctx.font = 'bold ' + fontSize + 'px Montserrat, sans-serif';
      labelCache = items.map(function(item) {
        var label = item;
        while (ctx.measureText(label).width > maxW && label.length > 3) {
          label = label.slice(0, -1);
        }
        if (label !== item) label = label.slice(0, -1) + '…';
        return label;
      });
    }

    function resize() {
      var size = canvas.parentElement.offsetWidth;
      canvas.width  = size;
      canvas.height = size;
      buildLabelCache();
      drawWheel(false);
    }

    /* skipText=true during animation for performance */
    function drawWheel(skipText) {
      var size = canvas.width;
      var cx = size / 2, cy = size / 2, r = size / 2 - 4;
      ctx.clearRect(0, 0, size, size);

      if (items.length === 0) {
        ctx.fillStyle = '#03061f';
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(201,209,217,0.3)';
        ctx.font = 'bold 16px Montserrat, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Add names to spin!', cx, cy);
        return;
      }

      var n = items.length;
      var arc = (Math.PI * 2) / n;

      /* fill all segments */
      for (var i = 0; i < n; i++) {
        var start = currentAngle + i * arc;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, start + arc);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
      }

      /* stroke all segments */
      ctx.strokeStyle = 'rgba(0,2,29,0.4)';
      ctx.lineWidth = 2;
      for (var i = 0; i < n; i++) {
        var start = currentAngle + i * arc;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, start + arc);
        ctx.closePath();
        ctx.stroke();
      }

      /* text — skip while spinning */
      if (!skipText && labelCache.length === n) {
        var fontSize = Math.min(Math.max(size * 0.026, 10), 17);
        ctx.font = 'bold ' + fontSize + 'px Montserrat, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur  = 4;
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (var i = 0; i < n; i++) {
          var start = currentAngle + i * arc;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(start + arc / 2);
          ctx.fillText(labelCache[i], r - 14, 0);
          ctx.restore();
        }
        ctx.shadowBlur = 0;
      }

      /* outer ring */
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(23,66,245,0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function spin() {
      if (spinning || items.length < 2) return;
      spinning = true;

      document.getElementById('spinBtn').disabled = true;
      document.getElementById('resultWrap').classList.remove('show');

      var extraSpins = (5 + Math.floor(Math.random() * 5)) * Math.PI * 2;
      var randomStop = Math.random() * Math.PI * 2;
      var target     = extraSpins + randomStop;
      var duration   = 4000 + Math.random() * 1500;
      var start      = null;
      var startAngle = currentAngle;

      function ease(t) { return 1 - Math.pow(1 - t, 4); }

      function step(ts) {
        if (!start) start = ts;
        var elapsed  = ts - start;
        var progress = Math.min(elapsed / duration, 1);
        currentAngle = startAngle + target * ease(progress);
        drawWheel(false);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          currentAngle = currentAngle % (Math.PI * 2);
          spinning = false;
          document.getElementById('spinBtn').disabled = false;
          drawWheel(false); /* draw text on final frame */
          showResult();
        }
      }

      requestAnimationFrame(step);
    }

    function showResult() {
      var n   = items.length;
      var arc = (Math.PI * 2) / n;
      var norm = ((Math.PI * 1.5 - currentAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      var idx  = Math.floor(norm / arc) % n;

      var award = document.getElementById('awardInput').value.trim();
      var awardEl = document.getElementById('resultAward');
      var labelEl = document.getElementById('resultWinnerLabel');
      if (award) {
        awardEl.textContent = '🏆 ' + award;
        labelEl.style.display = 'block';
      } else {
        awardEl.textContent = '🎉 Today\'s Winner';
        labelEl.style.display = 'none';
      }

      document.getElementById('resultText').textContent = items[idx];
      document.getElementById('resultWrap').classList.add('show');

      confetti({ particleCount: 180, spread: 100, origin: { y: 0.55 }, colors: ['#1742F5','#FF8C00','#00B6C3','#A855F7','#fff'] });
      setTimeout(function(){ confetti({ particleCount: 80, angle: 60,  spread: 70, origin: { x: 0, y: 0.6 } }); }, 250);
      setTimeout(function(){ confetti({ particleCount: 80, angle: 120, spread: 70, origin: { x: 1, y: 0.6 } }); }, 400);
    }

    function closeResult() {
      document.getElementById('resultWrap').classList.remove('show');
    }

    function renderList() {
      document.getElementById('namesList').value = items.join('\n');
      document.getElementById('nameCount').textContent = items.length + ' names';
    }

    function syncFromTextarea() {
      var ta = document.getElementById('namesList');
      items = ta.value.split(/[\n\r]+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
      document.getElementById('resultWrap').classList.remove('show');
      renderList();
      buildLabelCache();
      drawWheel(false);
    }

    function addItem() {
      var input = document.getElementById('addInput');
      var names = input.value.split(/[\n\r,]+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
      if (!names.length) return;
      names.forEach(function(n){ items.push(n); });
      input.value = '';
      renderList();
      buildLabelCache();
      drawWheel(false);
    }

    window.addEventListener('resize', resize);
    resize();
    renderList();
  </script>
</body>
</html>
