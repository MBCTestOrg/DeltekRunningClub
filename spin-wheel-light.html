<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin the Wheel — Awards Picker</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#F5F7FF; font-family:'Montserrat',sans-serif; color:#00021D; overflow:hidden; }

    body::before {
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:radial-gradient(rgba(23,66,245,0.04) 1px, transparent 1px);
      background-size:28px 28px;
    }

    /* NAV */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:99;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 28px;
      background:rgba(255,255,255,0.95); backdrop-filter:blur(14px);
      border-bottom:1px solid #E5E9F2;
    }
    .nav-brand { font-size:10px; font-weight:700; letter-spacing:3px; color:#3C454E; opacity:.5; text-transform:uppercase; }
    .nav-links { display:flex; gap:8px; }
    .nav-link {
      font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
      color:#3C454E; text-decoration:none;
      padding:7px 14px; border-radius:8px; border:1px solid transparent;
      transition:border-color 0.2s, color 0.2s;
    }
    .nav-link:hover  { border-color:rgba(23,66,245,0.4); color:#1742F5; }
    .nav-link.active { border-color:#1742F5; color:#1742F5; }
    .nav-link.dark-toggle { opacity:.4; font-size:9px; }
    .nav-link.dark-toggle:hover { opacity:.8; color:#3C454E; border-color:rgba(60,69,78,0.3); }

    /* LAYOUT */
    .layout {
      position:fixed; inset:0; top:53px; z-index:1;
      display:flex; align-items:center; justify-content:center;
      gap:clamp(24px,3vw,48px); padding:16px 32px 24px;
    }

    .wheel-side {
      display:flex; flex-direction:column; align-items:center; gap:16px;
      flex-shrink:0; padding-top:36px;
    }

    .wheel-wrap {
      position:relative;
      width:clamp(320px,46vw,600px);
      height:clamp(320px,46vw,600px);
    }

    .pointer {
      position:absolute; top:-22px; left:50%; transform:translateX(-50%);
      width:0; height:0;
      border-left:14px solid transparent;
      border-right:14px solid transparent;
      border-top:30px solid #FF8C00;
      z-index:10;
      filter:drop-shadow(0 2px 6px rgba(255,140,0,0.5));
    }

    canvas#wheel {
      width:100%; height:100%; border-radius:50%;
      box-shadow:0 0 0 4px rgba(23,66,245,0.2), 0 8px 40px rgba(23,66,245,0.15), 0 20px 60px rgba(0,0,0,0.1);
    }

    .hub {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:52px; height:52px; border-radius:50%;
      background:#FFFFFF; border:4px solid #1742F5;
      display:flex; align-items:center; justify-content:center;
      font-size:20px; z-index:10;
      box-shadow:0 0 20px rgba(23,66,245,0.3);
      cursor:pointer;
    }

    .spin-btn {
      font-family:'Montserrat',sans-serif;
      font-size:15px; font-weight:900; letter-spacing:3px; text-transform:uppercase;
      color:#fff; background:#1742F5;
      border:none; border-radius:999px; padding:14px 48px;
      cursor:pointer; transition:background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow:0 4px 24px rgba(23,66,245,0.4);
    }
    .spin-btn:hover   { background:#2d55ff; box-shadow:0 4px 32px rgba(23,66,245,0.6); }
    .spin-btn:active  { transform:scale(0.97); }
    .spin-btn:disabled { background:rgba(23,66,245,0.25); cursor:not-allowed; box-shadow:none; }

    /* result overlay — sits on top of the wheel */
    .result-wrap {
      position:absolute; inset:0; border-radius:50%; z-index:20;
      display:none; align-items:center; justify-content:center;
      background:rgba(245,247,255,0.88); backdrop-filter:blur(6px);
    }
    .result-wrap.show { display:flex; animation:popIn 0.35s cubic-bezier(0.34,1.3,0.64,1); }
    @keyframes popIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }

    .result-card {
      display:flex; flex-direction:column; align-items:center; gap:10px;
      text-align:center; padding:20px 16px;
    }
    .result-eyebrow {
      font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
      color:rgba(60,69,78,0.5);
    }
    .result-name {
      font-size:clamp(28px,4.5vw,52px); font-weight:900; color:#c96e00;
      line-height:1.15; word-break:break-word; max-width:260px;
    }
    .result-close {
      margin-top:6px;
      font-family:'Montserrat',sans-serif; font-size:11px; font-weight:800;
      letter-spacing:2px; text-transform:uppercase;
      color:rgba(60,69,78,0.6); background:rgba(0,2,29,0.06);
      border:1px solid rgba(0,2,29,0.15); border-radius:999px;
      padding:8px 20px; cursor:pointer;
      transition:background 0.2s, color 0.2s;
    }
    .result-close:hover { background:rgba(0,2,29,0.12); color:#00021D; }

    /* RIGHT — list panel */
    .list-side {
      width:clamp(200px,22vw,300px); flex-shrink:0;
      display:flex; flex-direction:column; gap:10px;
      height:calc(100vh - 53px - 40px);
      margin-left:56px;
    }

    .panel-header {
      display:flex; align-items:baseline; justify-content:space-between;
    }
    .panel-title { font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#3C454E; opacity:.5; }
    .panel-count { font-size:11px; font-weight:700; color:#1742F5; opacity:.7; }
    .panel-hint  { font-size:10px; font-weight:600; color:rgba(60,69,78,0.4); margin-top:-4px; }

    /* editable names textarea */
    .names-area {
      flex:1; min-height:0;
      font-family:'Montserrat',sans-serif;
      font-size:13px; font-weight:600; line-height:1.7;
      color:#00021D;
      background:#FFFFFF; border:1px solid rgba(23,66,245,0.2);
      border-radius:12px; padding:12px 14px;
      outline:none; resize:none;
      box-shadow:0 2px 10px rgba(23,66,245,0.06);
      transition:border-color 0.2s;
    }
    .names-area::placeholder { color:rgba(60,69,78,0.25); }
    .names-area:focus { border-color:rgba(23,66,245,0.5); }
    .names-area::-webkit-scrollbar { width:3px; }
    .names-area::-webkit-scrollbar-track { background:transparent; }
    .names-area::-webkit-scrollbar-thumb { background:rgba(23,66,245,0.3); border-radius:3px; }

    /* add input row */
    .add-row { display:flex; gap:8px; align-items:flex-end; flex-shrink:0; }
    .add-input {
      flex:1; font-family:'Montserrat',sans-serif;
      font-size:13px; font-weight:600; color:#00021D;
      background:#FFFFFF; border:1px solid rgba(23,66,245,0.25);
      border-radius:10px; padding:10px 14px; outline:none;
      box-shadow:0 2px 8px rgba(23,66,245,0.05);
      resize:none; height:66px; line-height:1.5;
      transition:border-color 0.2s;
    }
    .add-input::placeholder { color:rgba(60,69,78,0.3); font-size:11px; }
    .add-input:focus { border-color:#1742F5; }
    .add-btn {
      font-family:'Montserrat',sans-serif; font-size:18px; font-weight:700;
      color:#fff; background:#1742F5; border:none; border-radius:10px;
      width:40px; height:40px; cursor:pointer; transition:background 0.2s; flex-shrink:0;
    }
    .add-btn:hover { background:#2d55ff; }

  </style>
</head>
<body>

  <nav>
    <span class="nav-brand">Deltek Running Club</span>
    <div class="nav-links">
      <a href="index.html"            class="nav-link">← Home</a>
      <a href="spin-wheel-light.html" class="nav-link active">Spin the Wheel</a>
      <a href="spin-the-wheel.html"   class="nav-link dark-toggle">🌙 Dark</a>
    </div>
  </nav>

  <div class="layout">
    <div class="wheel-side">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
        <div class="hub" onclick="spin()">🎲</div>
        <div class="result-wrap" id="resultWrap">
          <div class="result-card">
            <div class="result-eyebrow">🎉 Today's Winner</div>
            <div class="result-name" id="resultText"></div>
            <button class="result-close" onclick="closeResult()">✕ Close</button>
          </div>
        </div>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>
    </div>

    <div class="list-side">
      <div class="panel-header">
        <div class="panel-title">Names on the wheel</div>
        <div class="panel-count" id="nameCount"></div>
      </div>
      <div class="panel-hint">Edit directly — one name per line</div>
      <textarea class="names-area" id="namesList"
                placeholder="Names will appear here…"
                onblur="syncFromTextarea()"></textarea>
      <div class="add-row">
        <textarea class="add-input" id="addInput"
                  placeholder="Paste from Excel or type names — one per line or comma-separated…"
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addItem();}"></textarea>
        <button class="add-btn" onclick="addItem()" title="Add names">+</button>
      </div>
    </div>
  </div>

  <script>
    var COLORS = ['#1742F5','#FF8C00','#00B6C3','#A855F7','#F59E0B','#EC4899','#22C55E','#FF6B35','#6366F1','#14B8A6','#F97316','#8B5CF6'];
    var items = ['Sarah Johnson','Mike Chen','Emma Davis','James Wilson','Olivia Martinez','Liam Thompson','Ava Rodriguez','Noah Anderson'];
    var currentAngle = 0, spinning = false, labelCache = [];
    var canvas = document.getElementById('wheel'), ctx = canvas.getContext('2d');

    function buildLabelCache() {
      var size=canvas.width, r=size/2-4, maxW=r*0.78;
      var fontSize=Math.min(Math.max(size*0.026,10),17);
      ctx.font='bold '+fontSize+'px Montserrat,sans-serif';
      labelCache=items.map(function(item){
        var label=item;
        while(ctx.measureText(label).width>maxW&&label.length>3) label=label.slice(0,-1);
        if(label!==item) label=label.slice(0,-1)+'…';
        return label;
      });
    }

    function resize() { var s=canvas.parentElement.offsetWidth; canvas.width=s; canvas.height=s; buildLabelCache(); drawWheel(false); }

    function drawWheel(skipText) {
      var size=canvas.width, cx=size/2, cy=size/2, r=size/2-4;
      ctx.clearRect(0,0,size,size);
      if(items.length===0){
        ctx.fillStyle='#EEF2FF'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(60,69,78,0.4)'; ctx.font='bold 16px Montserrat,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Add names to spin!',cx,cy); return;
      }
      var n=items.length, arc=(Math.PI*2)/n;
      /* fill */
      for(var i=0;i<n;i++){
        var s=currentAngle+i*arc;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s,s+arc); ctx.closePath();
        ctx.fillStyle=COLORS[i%COLORS.length]; ctx.fill();
      }
      /* stroke */
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2;
      for(var i=0;i<n;i++){
        var s=currentAngle+i*arc;
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s,s+arc); ctx.closePath(); ctx.stroke();
      }
      /* text — skip during animation */
      if(!skipText&&labelCache.length===n){
        var fontSize=Math.min(Math.max(size*0.026,10),17);
        ctx.font='bold '+fontSize+'px Montserrat,sans-serif';
        ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=4;
        ctx.textAlign='right'; ctx.textBaseline='middle';
        for(var i=0;i<n;i++){
          var s=currentAngle+i*arc;
          ctx.save(); ctx.translate(cx,cy); ctx.rotate(s+arc/2);
          ctx.fillText(labelCache[i],r-14,0); ctx.restore();
        }
        ctx.shadowBlur=0;
      }
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.strokeStyle='rgba(23,66,245,0.4)'; ctx.lineWidth=3; ctx.stroke();
    }

    function spin() {
      if(spinning||items.length<2) return;
      spinning=true; document.getElementById('spinBtn').disabled=true;
      document.getElementById('resultWrap').classList.remove('show');
      var extraSpins=(5+Math.floor(Math.random()*5))*Math.PI*2, randomStop=Math.random()*Math.PI*2;
      var target=extraSpins+randomStop, duration=4000+Math.random()*1500, start=null, startAngle=currentAngle;
      function ease(t){return 1-Math.pow(1-t,4);}
      function step(ts) {
        if(!start) start=ts;
        var elapsed=ts-start, progress=Math.min(elapsed/duration,1);
        currentAngle=startAngle+target*ease(progress); drawWheel(true);
        if(progress<1){requestAnimationFrame(step);}
        else{currentAngle=currentAngle%(Math.PI*2);spinning=false;document.getElementById('spinBtn').disabled=false;drawWheel(false);showResult();}
      }
      requestAnimationFrame(step);
    }

    function showResult() {
      var n=items.length, arc=(Math.PI*2)/n;
      var norm=((Math.PI*1.5-currentAngle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
      var idx=Math.floor(norm/arc)%n;
      document.getElementById('resultText').textContent=items[idx];
      document.getElementById('resultWrap').classList.add('show');
      confetti({ particleCount: 180, spread: 100, origin: { y: 0.55 }, colors: ['#1742F5','#FF8C00','#00B6C3','#A855F7','#22C55E'] });
      setTimeout(function(){ confetti({ particleCount: 80, angle: 60,  spread: 70, origin: { x: 0, y: 0.6 } }); }, 250);
      setTimeout(function(){ confetti({ particleCount: 80, angle: 120, spread: 70, origin: { x: 1, y: 0.6 } }); }, 400);
    }

    function closeResult() { document.getElementById('resultWrap').classList.remove('show'); }

    function renderList() {
      document.getElementById('namesList').value=items.join('\n');
      document.getElementById('nameCount').textContent=items.length+' names';
    }

    function syncFromTextarea() {
      var ta=document.getElementById('namesList');
      items=ta.value.split(/[\n\r]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
      document.getElementById('resultWrap').classList.remove('show');
      renderList(); buildLabelCache(); drawWheel(false);
    }

    function addItem() {
      var input=document.getElementById('addInput');
      var names=input.value.split(/[\n\r,]+/).map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
      if(!names.length) return;
      names.forEach(function(n){items.push(n);});
      input.value=''; renderList(); buildLabelCache(); drawWheel(false);
    }

    window.addEventListener('resize',resize); resize(); renderList();
  </script>
</body>
</html>
